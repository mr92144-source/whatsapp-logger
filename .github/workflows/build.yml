name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o WhatsAppNotificationLogger.zip -d .
          ls -la WhatsAppNotificationLogger

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Regenerate gradle-wrapper.jar
        working-directory: WhatsAppNotificationLogger
        run: |
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        working-directory: WhatsAppNotificationLogger
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: WhatsAppNotificationLogger
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: WhatsAppNotificationLogger/app/build/outputs/apk/debug/app-debug.apk
